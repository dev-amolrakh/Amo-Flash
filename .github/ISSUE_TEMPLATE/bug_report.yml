name: Bug report
description: Something in Amo Flash doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. A small reproduction helps a lot.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A code snippet, or a link to a StackBlitz / CodeSandbox.
      render: ts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Amo Flash version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options: [React, Next.js, Vue, Svelte, Angular, Vanilla / CDN, Other]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 on Windows 11
